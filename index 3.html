<style>

  .section-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .section-icon { color: #C9A14A; }

  .ex-item.checked .ex-check { background: #5FBF73; border-color: #5FBF73; }
  .ex-check svg { display: none; }
  .ex-item.checked .ex-check svg { display: block; }
  .ex-body { flex: 1; min-width: 0; }
  .ex-top { display: flex; justify-content: space-between; gap: 8px; }
  .ex-name { font-size: 15px; font-weight: 600; color: #F0F1F3; }
  .ex-item.checked .ex-name { color: #8FAE96; text-decoration: line-through; text-decoration-color: #5FBF7388; }
  .ex-reps { font-size: 14px; font-weight: 700; color: #C9A14A; flex-shrink: 0; }

  .ex-note { font-size: 12.5px; color: #7C8493; margin-top: 3px; line-height: 1.4; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #11151Cee; backdrop-filter: blur(10px); border-top: 1px solid #1F2530; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
  .nav-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 13px 0; border-radius: 12px; font-size: 14px; font-weight: 700; background: #1A1F29; color: #E8EAED; border: 1px solid #2A3140; }
  .nav-btn.primary { background: linear-gradient(135deg,#C9A14A,#B8893A); color: #0E1116; border: none; }
  .nav-btn:disabled { background: #161A22; color: #3A4150; border-color: #1F2530; opacity:.5; }
  .overlay { position: fixed; inset: 0; background: #0009; z-index: 20; display: none; align-items: flex-end; }
  .overlay.open { display: flex; }
  .sheet { background: #11151C; width: 100%; max-height: 80vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); border: 1px solid #232A36; border-bottom: none; }

  .week-block { margin-bottom: 14px; }
  .week-label { font-size: 11px; font-weight: 700; color: #7C8493; letter-spacing: 1px; margin-bottom: 8px; }
  .day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .day-card { background: #161A22; border: 1px solid #232A36; border-radius: 10px; padding: 10px 12px; text-align: left; width: 100%; }
  .day-card.current { background: #2A2410; border-color: #C9A14A; }
  .day-card-label { font-size: 11px; color: #7C8493; font-weight: 700; }

  .day-card-title { font-size: 13px; color: #E8EAED; font-weight: 600; margin-top: 2px; }
</style>

    focus:"Lighter loads, higher reps, good pump. Deload week upper body — feel the muscle working, not the weight moving. This session should feel almost enjoyable.",
    warmup:"Elliptical, moderate resistance, full stride — 10 min.",
    stretches:["Arm circles forward + back, 15 each","Banded external rotation (light), 15 reps","Wall slides, 10 slow reps","Cross-body shoulder stretch, 30 sec/side","Chest opener — hands clasped behind back, 30 sec","Seated spinal rotation, 5/side","Wrist circles + forearm stretch, 30 sec each","Child's pose, 45 sec"],
    rounds:[
      [["Cable chest fly","12","Light, full squeeze — feel the chest throughout."],["Cable face pull","15","Shoulder health, high rep."],["Bicep curl","12","Full range, slow eccentric — earn the pump."]],
      [["Incline DB press, light","12","Controlled. Whatever weight feels comfortable and clean."],["Single-arm DB row","12/side","Full range, unhurried."],["Hammer curl","12","Both arms."]],
      [["Push-up","12","Standard or incline — whatever feels right today."],["Band pull-apart","20","High rep upper back. Squeeze at the back."],["Triceps rope pushdown","15","Light, full extension, squeeze."]],
    ],
    ab:["Side plank","30 sec/side","Controlled, no hip sag. Last side plank of the block."],
  },
  {

    focus:"Strength-mobility blend at deload pace. Extra rest between rounds, extra time in the stretches. Your body is rebuilding — give it room to do that before the finisher.",
    warmup:"Stair stepper, easy-moderate pace — 10 min. Recovery day energy.",
    stretches:["90/90 hip stretch, 30 sec/side","Pigeon stretch, 30-45 sec/side","Lying spinal twist, 30 sec/side","Doorway chest stretch (light), 30 sec","Calf stretch, 30 sec/side","Child's pose with lateral reach, 45 sec","Standing side bend, 5/side","Neck rolls + shoulder rolls, 10 each way"],
    rounds:[
      [["Hip 90/90 transition (mobility)","5/side","Move through the position — not just hold it."],["Glute bridge, moderate","15","High rep, feel the glutes. This is the work."],["Pigeon pose hold","45 sec/side","This is your round rest — hold it well."]],
      [["World's greatest stretch into T-spine rotation","5/side","Slow and deliberate, full range."],["Goblet squat, light + long pause","10","3 sec pause at bottom — hip opener and quad work combined."],["Child's pose lateral reach","45 sec/side","Let the lats open. Breathe into the stretch."]],
      [["Leg press, light + slow","10","5 sec eccentric — time under tension is the point."],["Seated cable row, light + slow","10","4 sec return. Control."],["Dead bug","10/side","Best set of the program — slow, perfect, deliberate."]],
    ],
    ab:["Hollow body hold","25-30 sec","Last hollow body. Make it count."],

  {
    id:"w4d4",week:4,dayNum:4,title:"Program Finisher",subtitle:"Best of the block",
    focus:"Final session. Pick your best weights from the past 4 weeks on each lift. Finish clean. You've built toward this.",

      [["Hip thrust, peak weight","10","Best of the program. Go for it."],["Incline DB press, best weight","10","Controlled, confident."],["Weighted pull-up or heavy lat pulldown","8","Finish the pull work strong."]],
      [["Romanian deadlift, strong weight","10","Crisp hinge, flat back. Best version of this lift."],["Cable chest fly","12","Mind-muscle — feel the chest working."],["Single-arm DB row, heavy","10/side","Best row of the block. Brace and pull."]],
      [["Leg press, strong weight","10","One more good set. Controlled down, drive up."],["Cable face pull","15","Shoulder health — always, every week, forever."],["Farmer's carry, heavy","45 sec","Last carry. Own it."]],

const PROGRESS_KEY = "workout-progress-v2";
const CHECKS_PREFIX = "workout-checks-v2:";
function getProgress(){const v=localStorage.getItem(PROGRESS_KEY);const i=v?parseInt(v,10):0;return(!isNaN(i)&&i>=0&&i<W.length)?i:0;}
function saveProgress(i){localStorage.setItem(PROGRESS_KEY,String(i));}
function getChecks(id){const v=localStorage.getItem(CHECKS_PREFIX+id);return v?JSON.parse(v):{};}
function saveChecks(id,c){localStorage.setItem(CHECKS_PREFIX+id,JSON.stringify(c));}

let idx=getProgress(), checks=getChecks(W[idx].id), navOpen=false;

const I={
  flame:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>',
  wind:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>',
  dumbbell:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6.5 6.5 11 11M21 21l-1-1M3 3l1 1m5.5 1.5-4 4m11 5-4 4M14 5l5 5M5 14l5 5M9.5 9.5l5 5"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E1116" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>',
  cl:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
  cr:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
};

function render(){
  const d=W[idx];
  const total=d.rounds.reduce((a,r)=>a+r.length,0)+1;
  const done=Object.values(checks).filter(Boolean).length;
  const pct=Math.round((done/total)*100);
  document.getElementById("app").innerHTML=`
    <div class="header">
      <div class="header-row">
        <div>
          <div class="eyebrow">Week ${d.week} · Day ${d.dayNum}</div>
          <div class="title">${d.title}${d.subtitle?` <span class="subtitle">· ${d.subtitle}</span>`:""}</div>
        </div>
        <button class="all-days-btn" id="adb">ALL DAYS</button>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${done}/${total} done</div>
    </div>
    <div class="focus-note">${d.focus}</div>
    <div class="section">
      <div class="section-head"><span class="section-icon">${I.flame}</span><span class="section-label">Warmup</span><span class="section-sub">· 10 min</span></div>
      <div class="warmup-text">${d.warmup}</div>
    </div>
    <div class="section">
      <div class="section-head"><span class="section-icon">${I.wind}</span><span class="section-label">Stretch</span><span class="section-sub">· 12-15 min</span></div>
      <ul class="stretch-list">${d.stretches.map(s=>`<li>${s}</li>`).join("")}</ul>
    </div>
    <div class="section">
      <div class="section-head"><span class="section-icon">${I.dumbbell}</span><span class="section-label">Strength</span><span class="section-sub">· 30-35 min · 3 rounds</span></div>
      ${d.rounds.map((round,ri)=>{
        const last=ri===d.rounds.length-1;
        const exs=last?[...round,d.ab]:round;
        return`<div class="round-block"><div class="round-label">ROUND ${ri+1}</div><div class="ex-list">${exs.map((ex,ei)=>{
          const k=`${ri}-${ei}`,chk=!!checks[k];
          return`<button class="ex-item${chk?" checked":""}" data-key="${k}">
            <div class="ex-check">${I.check}</div>
            <div class="ex-body"><div class="ex-top"><div class="ex-name">${ex[0]}</div><div class="ex-reps">${ex[1]}</div></div><div class="ex-note">${ex[2]}</div></div>
          </button>`;
        }).join("")}</div></div>`;
      }).join("")}
    </div>
    <div class="bottom-nav">
      <button class="nav-btn" id="pb" ${idx===0?"disabled":""}>${I.cl} Prev</button>
      <button class="nav-btn primary" id="nb" ${idx===W.length-1?"disabled":""}>Next Day ${I.cr}</button>
    </div>
    <div class="overlay${navOpen?" open":""}" id="ov">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">4-Week Program</div>
        ${[1,2,3,4].map(wk=>`<div class="week-block"><div class="week-label">WEEK ${wk}</div><div class="day-grid">${W.filter(p=>p.week===wk).map(p=>{const i2=W.indexOf(p);return`<button class="day-card${i2===idx?" current":""}" data-idx="${i2}"><div class="day-card-label">DAY ${p.dayNum}</div><div class="day-card-title">${p.title}</div></button>`;}).join("")}</div></div>`).join("")}
      </div>
    </div>`;
  document.querySelectorAll(".ex-item").forEach(b=>{b.addEventListener("click",()=>{const k=b.dataset.key;checks[k]=!checks[k];saveChecks(W[idx].id,checks);render();});});
  document.getElementById("pb").addEventListener("click",()=>go(idx-1));
  document.getElementById("nb").addEventListener("click",()=>go(idx+1));
  document.getElementById("adb").addEventListener("click",()=>{navOpen=true;render();});
  document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov"){navOpen=false;render();}});
  document.querySelectorAll(".day-card").forEach(b=>{b.addEventListener("click",()=>go(parseInt(b.dataset.idx,10)));});
}

function go(i){if(i<0||i>=W.length)return;idx=i;saveProgress(i);checks=getChecks(W[idx].id);navOpen=false;window.scrollTo({top:0,behavior:"auto"});render();}
render();
</script>
</body>
</html>
